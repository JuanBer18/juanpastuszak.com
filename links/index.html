<style>
@font-face{font-family:Fraunces;src:url(../fonts/fraunces-normal-latin.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:Inter;src:url(../fonts/inter-normal-latin.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--paper:#eef0ec;--ink:#1d1a16;--soft:#5b5750;--rule:#c9ccc5;--card:#f8f9f6}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:32px 20px}
main{width:100%;max-width:420px}
h1{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:clamp(30px,8vw,38px);line-height:1.12;margin:0 0 10px;letter-spacing:-.01em}
p.role{margin:0 0 32px;color:var(--soft);font-size:16px;line-height:1.5}
a.link{display:flex;align-items:center;gap:14px;padding:18px 20px;margin:0 0 12px;background:var(--card);border:1px solid var(--rule);border-radius:12px;color:var(--ink);text-decoration:none;min-height:64px}
a.link:hover,a.link:focus-visible{border-color:var(--ink)}
a.link:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
a.link svg{flex:none;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
a.link span{display:block}
a.link b{display:block;font-weight:500;font-size:17px}
a.link small{display:block;color:var(--soft);font-size:14px;margin-top:2px}
@media (prefers-color-scheme:dark){:root{--paper:#14161a;--ink:#eceae4;--soft:#a39f96;--rule:#34373d;--card:#1b1e23}}
</style>
</head>
